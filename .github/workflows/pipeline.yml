name: MPLY Article Production Pipeline
on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC
  workflow_dispatch:    # Allows manual 1-click trigger by Production Team
jobs:
  produce-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Production Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BRIEF_SHEET_ID: ${{ secrets.BRIEF_SHEET_ID }}
          TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID }}
          DRIVE_ARTICLES_FOLDER_ID: ${{ secrets.DRIVE_ARTICLES_FOLDER_ID }}
          DRIVE_IMAGES_FOLDER_ID: ${{ secrets.DRIVE_IMAGES_FOLDER_ID }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python generate.py