UPDATE task_work_tracker twt
JOIN task t ON t.task_id = twt.task_id
JOIN tfs_user u ON u.user_id = twt.user_id
SET 
    twt.actual_target = t.task_target,
    twt.tenure_target = @tt := ROUND(t.task_target * u.user_tenure, 2),
    twt.billable_hours = 
        CASE 
            WHEN @tt > 0 THEN ROUND(twt.production / @tt, 2)
            ELSE 0
        END
WHERE 
    twt.user_id NOT IN (129,144,131,133,141) 
    AND twt.date_time < '2026-04-01'         
    AND t.task_target IS NOT NULL
    AND u.user_tenure IS NOT NULL
    AND u.user_tenure > 0;













UPDATE task_work_tracker twt
JOIN task t ON t.task_id = twt.task_id
JOIN tfs_user u ON u.user_id = twt.user_id
SET 
    twt.actual_target = t.task_target,
    twt.tenure_target = ROUND(t.task_target * 1.25, 2),
    twt.billable_hours = 
        CASE 
            WHEN t.task_target * 1.25 > 0 
            THEN ROUND(twt.production / (t.task_target * 1.25), 2)
            ELSE 0
        END
WHERE 
    twt.user_id = 133
    AND twt.date_time >= '2026-04-01'
    AND twt.task_id = 6             
    AND t.task_target IS NOT NULL
    AND u.user_tenure IS NOT NULL
    AND u.user_tenure > 0;


UPDATE task_work_tracker twt
JOIN task t ON t.task_id = twt.task_id
JOIN tfs_user u ON u.user_id = twt.user_id
SET 
    twt.actual_target = t.task_target,
    twt.tenure_target = ROUND(t.task_target * 1.15, 2),
    twt.billable_hours = 
        CASE 
            WHEN t.task_target * 1.15 > 0 
            THEN ROUND(twt.production / (t.task_target * 1.15), 2)
            ELSE 0
        END
WHERE 
    twt.user_id = 133
    AND DATE(twt.date_time) BETWEEN '2026-04-01' AND '2026-04-16'             
    AND t.task_target IS NOT NULL
    AND u.user_tenure IS NOT NULL
    AND u.user_tenure > 0;