UPDATE task_work_tracker twt
JOIN task t ON t.task_id = twt.task_id
SET 
    twt.actual_target = t.task_target,
    twt.tenure_target = @tt := ROUND(t.task_target * 1, 2),
    twt.billable_hours = 
        CASE 
            WHEN @tt > 0 THEN ROUND(twt.production / @tt, 2)
            ELSE 0
        END
WHERE 
    twt.user_id = 141
    AND twt.date_time < '2026-04-03'
    AND t.task_target IS NOT NULL
	
